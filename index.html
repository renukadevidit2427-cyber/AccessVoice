
<label for="speechLanguage">Choose language</label>
<select id="speechLanguage">
  <option value="en-US">English</option>
  <option value="ta-IN">தமிழ் (Tamil)</option>
  <option value="hi-IN">हिन्दी (Hindi)</option>
  <option value="te-IN">తెలుగు (Telugu)</option>
  <option value="ml-IN">മലയാളം (Malayalam)</option>
  <option value="kn-IN">ಕನ್ನಡ (Kannada)</option>
  <option value="fr-FR">Français (French)</option>
  <option value="es-ES">Español (Spanish)</option>
  <option value="de-DE">Deutsch (German)</option>
  <option value="ja-JP">日本語 (Japanese)</option>
  <option value="zh-CN">中文 (Chinese)</option>
</select>

<label for="speechMessage">Your message</label>
<textarea id="speechMessage"
  placeholder="Type your message here"></textarea>

<button type="button" id="speakMessage">🔊 Speak</button>
<button type="button" id="stopSpeech">⏹ Stop</button>

<p id="speechStatus" role="status" aria-live="polite"></p>

<script>
const languageSelect = document.getElementById("speechLanguage");
const messageInput = document.getElementById("speechMessage");
const status = document.getElementById("speechStatus");

document.getElementById("speakMessage").addEventListener("click", () => {
  const message = messageInput.value.trim();

  if (!message) {
    status.textContent = "Please type a message first.";
    return;
  }

  if (!("speechSynthesis" in window)) {
    status.textContent = "Speech is not supported in this browser.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = languageSelect.value;

  const voices = window.speechSynthesis.getVoices();
  const matchingVoice = voices.find(
    voice => voice.lang.toLowerCase() ===
      languageSelect.value.toLowerCase()
  );

  if (matchingVoice) {
    utterance.voice = matchingVoice;
  }

  utterance.onstart = () => {
    status.textContent = "Speaking...";
  };

  utterance.onend = () => {
    status.textContent = "Finished speaking.";
  };

  utterance.onerror = () => {
    status.textContent =
      "Speech failed. Check browser voice and language support.";
  };

  window.speechSynthesis.speak(utterance);
});

document.getElementById("stopSpeech").addEventListener("click", () => {
  window.speechSynthesis.cancel();
  status.textContent = "Speech stopped.";
});
</script>
