
<label for="languageSelect">Choose your language</label>
<select id="languageSelect">
  <option value="">Loading available languages...</option>
</select>

<label for="messageInput">Type your message</label>
<textarea id="messageInput" placeholder="Type here..."></textarea>

<button type="button" id="speakButton">🔊 Speak</button>
<p id="languageStatus" role="status" aria-live="polite"></p>

<script>
const languageSelect = document.getElementById("languageSelect");
const messageInput = document.getElementById("messageInput");
const languageStatus = document.getElementById("languageStatus");

let availableVoices = [];

function loadLanguages() {
  if (!("speechSynthesis" in window)) {
    languageSelect.innerHTML =
      '<option value="">Speech is not supported</option>';
    languageStatus.textContent =
      "Your browser does not support speech synthesis.";
    return;
  }

  availableVoices = window.speechSynthesis.getVoices();

  const previousLanguage = languageSelect.value;
  languageSelect.innerHTML = "";

  if (availableVoices.length === 0) {
    languageSelect.add(new Option(
      "No voices found yet — try refreshing", ""
    ));
    languageStatus.textContent =
      "Browser voices are not available yet.";
    return;
  }

  const languages = [...new Set(
    availableVoices.map(voice => voice.lang).filter(Boolean)
  )].sort((a, b) => a.localeCompare(b));

  languages.forEach(lang => {
    const count = availableVoices.filter(
      voice => voice.lang === lang
    ).length;

    languageSelect.add(new Option(
      `${lang} (${count} voice${count > 1 ? "s" : ""})`,
      lang
    ));
  });

  if (languages.includes(previousLanguage)) {
    languageSelect.value = previousLanguage;
  } else {
    const preferred = languages.find(
      lang => lang.toLowerCase() === "ta-in"
    ) || languages.find(
      lang => lang.toLowerCase() === "en-in"
    ) || languages.find(
      lang => lang.toLowerCase().startsWith("en")
    ) || languages[0];

    languageSelect.value = preferred;
  }

  languageStatus.textContent =
    `${languages.length} language options found on this device.`;
}

if ("speechSynthesis" in window) {
  loadLanguages();
  window.speechSynthesis.addEventListener(
    "voiceschanged", loadLanguages
  );
}

document.getElementById("speakButton").addEventListener("click", () => {
  const message = messageInput.value.trim();
  const lang = languageSelect.value;

  if (!message) {
    languageStatus.textContent = "First type a message.";
    return;
  }

  if (!lang) {
    languageStatus.textContent =
      "No speech language is available on this device.";
    return;
  }

  const voice = availableVoices.find(v => v.lang === lang);

  if (!voice) {
    languageStatus.textContent =
      "A voice for this language is not available.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.voice = voice;
  utterance.lang = voice.lang;

  utterance.onstart = () => {
    languageStatus.textContent = "Speaking...";
  };

  utterance.onend = () => {
    languageStatus.textContent = "Finished speaking.";
  };

  utterance.onerror = () => {
    languageStatus.textContent =
      "Speech failed. Please try another available voice.";
  };

  window.speechSynthesis.speak(utterance);
});
</script>
